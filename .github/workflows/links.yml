name: links

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".github/workflows/links.yml"

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      markdown: ${{ steps.filter.outputs.markdown }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            markdown:
              - "**/*.md"
              - ".github/workflows/links.yml"

  markdown-links:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip (no markdown changes)
        if: needs.changes.outputs.markdown != 'true'
        run: echo "No markdown changes in this event; skipping link check."

      - name: Checkout
        if: needs.changes.outputs.markdown == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check markdown links (internal)
        if: needs.changes.outputs.markdown == 'true'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          fail: true
          args: >-
            --offline
            --no-progress
            --exclude-path docs/node_modules
            --exclude-path docs/dist
            --exclude-path frontend/node_modules
            "./**/*.md"
