name: links

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/links.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".github/workflows/links.yml"

permissions:
  contents: read

jobs:
  markdown-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Check markdown links (internal)
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2
        with:
          fail: true
          args: >-
            --offline
            --no-progress
            --exclude-path docs/node_modules
            --exclude-path docs/dist
            --exclude-path frontend/node_modules
            "./**/*.md"
