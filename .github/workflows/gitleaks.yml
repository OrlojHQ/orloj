name: gitleaks

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly full-history scan to catch secrets in older commits.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Full history so the scan covers all commits, not just the latest.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only required for GitHub organizations.
          # Add it as a repo/org secret if Orloj is moved under an org account.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
